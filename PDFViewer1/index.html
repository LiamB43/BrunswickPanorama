<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Document View</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1a1a;
      touch-action: none;
    }

    #container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    #content {
      transform-origin: center center;
      will-change: transform;
      user-select: none;
      -webkit-user-select: none;
    }

    /* --- PDF mode --- */
    #pdf-canvas {
      display: block;
      max-width: 100vw;
      box-shadow: 0 4px 24px rgba(0,0,0,0.5);
    }

    /* --- Image mode --- */
    #img-view {
      display: block;
      max-width: 100vw;
      max-height: 100vh;
      box-shadow: 0 4px 24px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
<div id="container">
  <div id="content">
    <!-- Populated by JS -->
  </div>
</div>

<!-- PDF.js -->
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.min.mjs" type="module"></script>

<script type="module">
  // ─── CONFIG ──────────────────────────────────────────────────────────────────
  const FILE      = 'document.pdf';   // ← change to your filename
  const MODE      = 'pdf';            // 'pdf' or 'image'
  const PDF_SCALE = 4;                // higher = sharper on retina, larger initial render
  // ─────────────────────────────────────────────────────────────────────────────

  const container = document.getElementById('container');
  const content   = document.getElementById('content');

  // ── Render ──────────────────────────────────────────────────────────────────

  if (MODE === 'image') {
    const img = document.createElement('img');
    img.id  = 'img-view';
    img.src = FILE + '?t=' + Date.now();
    img.draggable = false;
    content.appendChild(img);
  } else {
    // PDF.js render – page 1 only
    const { pdfjsLib } = globalThis;

    // Required worker config for CDN usage
    const pdfjsLib2 = await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.min.mjs');
    pdfjsLib2.GlobalWorkerOptions.workerSrc =
      'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.worker.min.mjs';

    const loadingTask = pdfjsLib2.getDocument(FILE + '?t=' + Date.now());
    const pdf  = await loadingTask.promise;
    const page = await pdf.getPage(1);

    const viewport = page.getViewport({ scale: PDF_SCALE });
    const canvas   = document.createElement('canvas');
    canvas.id = 'pdf-canvas';
    canvas.width  = viewport.width;
    canvas.height = viewport.height;

    // Scale canvas display size to fit screen width initially
    const displayScale = window.innerWidth / viewport.width;
    canvas.style.width  = (viewport.width  * displayScale) + 'px';
    canvas.style.height = (viewport.height * displayScale) + 'px';

    content.appendChild(canvas);

    await page.render({
      canvasContext: canvas.getContext('2d'),
      viewport
    }).promise;
  }

  // ── Pan & Pinch-zoom ────────────────────────────────────────────────────────

  let scale    = 1;
  let tx       = 0;  // translateX
  let ty       = 0;  // translateY

  // Pinch state
  let lastDist = null;
  let lastMidX = 0;
  let lastMidY = 0;

  // Pan state
  let isPanning   = false;
  let panStartX   = 0;
  let panStartY   = 0;
  let panOriginTx = 0;
  let panOriginTy = 0;

  const MIN_SCALE = 0.5;
  const MAX_SCALE = 8;

  function applyTransform() {
    content.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
  }

  function dist(t) {
    const dx = t[0].clientX - t[1].clientX;
    const dy = t[0].clientY - t[1].clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }

  function mid(t) {
    return {
      x: (t[0].clientX + t[1].clientX) / 2,
      y: (t[0].clientY + t[1].clientY) / 2
    };
  }

  container.addEventListener('touchstart', e => {
    e.preventDefault();
    if (e.touches.length === 2) {
      lastDist = dist(e.touches);
      const m  = mid(e.touches);
      lastMidX = m.x;
      lastMidY = m.y;
      isPanning = false;
    } else if (e.touches.length === 1) {
      isPanning   = true;
      panStartX   = e.touches[0].clientX;
      panStartY   = e.touches[0].clientY;
      panOriginTx = tx;
      panOriginTy = ty;
    }
  }, { passive: false });

  container.addEventListener('touchmove', e => {
    e.preventDefault();
    if (e.touches.length === 2) {
      isPanning = false;
      const d   = dist(e.touches);
      const m   = mid(e.touches);
      const ds  = d / lastDist;

      // Zoom toward pinch midpoint
      const rect    = container.getBoundingClientRect();
      const originX = m.x - rect.left - rect.width  / 2;
      const originY = m.y - rect.top  - rect.height / 2;

      const newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, scale * ds));
      const scaleDelta = newScale / scale;

      tx = originX + (tx - originX) * scaleDelta + (m.x - lastMidX);
      ty = originY + (ty - originY) * scaleDelta + (m.y - lastMidY);
      scale = newScale;

      lastDist = d;
      lastMidX = m.x;
      lastMidY = m.y;

      applyTransform();

    } else if (e.touches.length === 1 && isPanning) {
      tx = panOriginTx + (e.touches[0].clientX - panStartX);
      ty = panOriginTy + (e.touches[0].clientY - panStartY);
      applyTransform();
    }
  }, { passive: false });

  container.addEventListener('touchend', e => {
    if (e.touches.length < 2) lastDist = null;
    if (e.touches.length === 0) isPanning = false;
  });

  // Mouse wheel zoom (desktop)
  container.addEventListener('wheel', e => {
    e.preventDefault();
    const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
    const rect    = container.getBoundingClientRect();
    const originX = e.clientX - rect.left - rect.width  / 2;
    const originY = e.clientY - rect.top  - rect.height / 2;
    const newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, scale * zoomFactor));
    const scaleDelta = newScale / scale;
    tx = originX + (tx - originX) * scaleDelta;
    ty = originY + (ty - originY) * scaleDelta;
    scale = newScale;
    applyTransform();
  }, { passive: false });

  // Mouse drag (desktop)
  container.addEventListener('mousedown', e => {
    isPanning   = true;
    panStartX   = e.clientX;
    panStartY   = e.clientY;
    panOriginTx = tx;
    panOriginTy = ty;
    container.style.cursor = 'grabbing';
  });
  container.addEventListener('mousemove', e => {
    if (!isPanning) return;
    tx = panOriginTx + (e.clientX - panStartX);
    ty = panOriginTy + (e.clientY - panStartY);
    applyTransform();
  });
  container.addEventListener('mouseup',   () => { isPanning = false; container.style.cursor = 'default'; });
  container.addEventListener('mouseleave',() => { isPanning = false; container.style.cursor = 'default'; });
</script>
</body>
</html>
